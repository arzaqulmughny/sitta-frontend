<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Bahan Ajar Universitas Terbuka</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/login.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <!-- Favicon -->
    <link rel="shortcut icon" href="/assets/images/Universitas Terbuka.png" type="image/x-icon">
</head>

<body>
    <main>
        <form class="container" onsubmit="onSubmitLogin(event)">
            <div class="logo">
                <img src="/assets/images/Universitas Terbuka.png" alt="">
            </div>

            <div class="header">
                <h1 class="title">Login Sistem Bahan Ajar</h1>
                <p class="subtitle">Universitas Terbuka</p>
            </div>

            <!-- Alert -->
            <div id="inline-alert" class="alert alert--danger" style="display: none;">
                <div class="alert__icon">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="currentColor">
                        <path
                            d="M508.5-291.5Q520-303 520-320t-11.5-28.5Q497-360 480-360t-28.5 11.5Q440-337 440-320t11.5 28.5Q463-280 480-280t28.5-11.5ZM440-440h80v-240h-80v240Zm40 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
                    </svg>
                </div>

                <div class="alert__text">
                    <div class="alert__title" id="inline-alert-title">
                    </div>

                    <div class="alert__message" id="inline-alert-message">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <!-- Input Email -->
                <label class="input">
                    <p class="input__label">Alamat Email</p>
                    <div class="input__inner">
                        <svg class="input__icon" xmlns="http://www.w3.org/2000/svg" height="24px"
                            viewBox="0 -960 960 960" width="24px" fill="currentColor">
                            <path
                                d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z" />
                        </svg>
                        <input autofocus id="email" type="text" placeholder="email@ut.ac.id">
                    </div>
                </label>

                <!-- Input Password -->
                <label class="input">
                    <p class="input__label">Password</p>
                    <div class="input__inner">
                        <svg class="input__icon" xmlns="http://www.w3.org/2000/svg" height="24px"
                            viewBox="0 -960 960 960" width="24px" fill="currentColor">
                            <path
                                d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm296.5-143.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z" />
                        </svg>
                        <input id="password" type="password" placeholder="Masukkan kata sandi">
                    </div>
                </label>
            </div>

            <div class="form-group">
                <div class="actions">
                    <label class="checkbox">
                        <input type="checkbox" name="remember" id="remember">
                        <p class="input__label">Ingat Saya</p>
                    </label>

                    <a href="/forgot" class="link">Lupa Password?</a>
                </div>

                <button type="submit" class="button button--primary" style="width: 100%;">
                    Login
                </button>
            </div>
        </form>
    </main>

    <script src="/assets/js/login.js"></script>
</body>

</html>
